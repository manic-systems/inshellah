name: Tag and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  prepare:
    name: Prepare
    permissions:
      contents: write
      id-token: write
    needs: ci
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@ec457510b197b2eeb8b2ea2d182f31e3ed7157bd # v2.3.3
    with:
      stage: prepare
      assets: false
      version-command: nix run nixpkgs#fq -- -r .package.version Cargo.toml

  publish:
    name: Publish
    permissions:
      contents: write
      id-token: write
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@ec457510b197b2eeb8b2ea2d182f31e3ed7157bd # v2.3.3
    with:
      stage: publish
      version: ${{ needs.prepare.outputs.version }}
      install-nix: false
      publish-command: cargo publish --locked
