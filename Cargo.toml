[package]
name = "inshellah"
version = "0.1.3"
description = "Nushell completions indexed from manpages, native generators, and --help output"
keywords = ["nushell", "completion", "manpage", "shell", "cli"]
categories = ["command-line-utilities"]
edition = "2024"
rust-version = "1.97.0"
license = "EUPL-1.2"
repository = "https://github.com/manic-systems/inshellah"
include = ["src", "doc", "README.md", "LICENSE"]

[dependencies]
flate2 = "1.1.9"
libc = "0.2.186"
nom = "8.0.0"
pound = "0.6.1"
serde_core = "1.0.228"
serde_json = "1.0.149"

[lints.clippy]
cargo       = { level = "warn", priority = -1 }
nursery     = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }

blanket_clippy_restriction_lints = "allow"

arbitrary_source_item_ordering     = "allow"
arithmetic_side_effects            = "allow"
default_numeric_fallback           = "allow"
doc_paragraphs_missing_punctuation = "allow"
else_if_without_else               = "allow"
error_impl_error                   = "allow"
exhaustive_enums                   = "allow"
exhaustive_structs                 = "allow"
implicit_return                    = "allow"
indexing_slicing                   = "allow"
inline_modules                     = "allow"
integer_division                   = "allow"
integer_division_remainder_used    = "allow"
missing_docs_in_private_items      = "allow"
missing_inline_in_public_items     = "allow"
missing_trait_methods              = "allow"
mod_module_files                   = "allow"
module_name_repetitions            = "allow"
must_use_candidate                 = "allow"
pattern_type_mismatch              = "allow"
print_stderr                       = "allow"
print_stdout                       = "allow"
pub_with_shorthand                 = "allow"
question_mark_used                 = "allow"
ref_patterns                       = "allow"
rest_pat_in_fully_bound_structs    = "allow"
self_named_module_files            = "allow"
separated_literal_suffix           = "allow"
single_call_fn                     = "allow"
std_instead_of_alloc               = "allow"
std_instead_of_core                = "allow"
tests_outside_test_module          = "allow"
