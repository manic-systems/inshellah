[package]
name = "inshellah"
version = "0.1.3"
description = "Nushell completions indexed from manpages, native generators, and --help output"
keywords = ["nushell", "completion", "manpage", "shell", "cli"]
categories = ["command-line-utilities"]
edition = "2024"
license = "EUPL-1.2"
repository = "https://github.com/manic-systems/inshellah"
include = ["src", "doc", "README.md", "LICENSE"]

[dependencies]
flate2 = "1.1.9"
libc = "0.2.186"
nom = "8.0.0"
pound = "0.6.1"
serde_json = { version = "1.0.149", features = ["preserve_order"] }
